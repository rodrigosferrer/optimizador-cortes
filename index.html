<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimizador de Cortes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Optimizador de Cortes</h1>
    <div class="acciones" id="acciones-header"></div>
    <input type="file" id="file-import" accept=".json" hidden>
  </header>

  <main>
    <section class="config-panel" id="config-panel">
      <h2>Configuración</h2>
      <div id="config-placas"></div>
      <div class="config-globals">
        <label>Kerf (mm) <input type="number" id="cfg-kerf" min="0" step="0.1"></label>
        <label>Margen (mm) <input type="number" id="cfg-margen" min="0" step="0.1"></label>
      </div>

      <h2>Piezas</h2>
      <table id="tabla-piezas">
        <thead>
          <tr><th>Nombre</th><th>Ancho</th><th>Alto</th><th>Cant.</th><th title="Dirección de la veta de la pieza">Veta</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="acciones" id="acciones-piezas"></div>
      <input type="file" id="file-csv" accept=".csv,text/csv" hidden>
    </section>

    <div class="splitter" id="splitter" title="Arrastrá para redimensionar"></div>

    <section class="resultado-panel" id="resultado-panel">
      <div class="acciones acciones-resultado" id="acciones-resultado"></div>
      <div id="resultado"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
