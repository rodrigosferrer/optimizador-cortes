<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimizador de Cortes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Optimizador de Cortes</h1>
    <div class="acciones" id="acciones-header"></div>
    <input type="file" id="file-import" accept=".json" hidden>
  </header>

  <main>
    <section class="config-panel" id="config-panel">
      <div class="proyecto-nombre">
        <label for="cfg-nombre">Proyecto</label>
        <input type="text" id="cfg-nombre" placeholder="Nombre del mueble" autocomplete="off">
      </div>

      <h2>Configuración</h2>
      <div id="config-placas"></div>
      <div class="config-globals">
        <label>Kerf (mm) <input type="number" id="cfg-kerf" min="0" step="0.1">
          <span class="tip" data-tip="Espesor de la sierra: cuánto material consume cada corte. Típico 3 mm.">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          </span>
        </label>
        <label>Margen (mm) <input type="number" id="cfg-margen" min="0" step="0.1">
          <span class="tip" data-tip="Milímetros que se descuentan del borde de cada placa, p.ej. para evitar bordes dañados.">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          </span>
        </label>
        <label>Estrategia de placa
          <select id="cfg-estrategia">
            <option value="chica-primero">Chica primero (ahorra grandes)</option>
            <option value="grande-primero">Grande primero (menos placas)</option>
            <option value="orden-manual">Orden manual</option>
            <option value="agotar-stock">Agotar stock (usar todo lo que tengo)</option>
          </select>
          <span class="tip" data-tip="Chica primero: usa primero placas chicas si la pieza entra (reserva las grandes).&#10;Grande primero: maximiza piezas por placa.&#10;Orden manual: respeta el orden de la lista.&#10;Agotar stock: pre-abre una placa de cada tipo con stock real antes de pedir placas virtuales (faltantes).">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          </span>
        </label>
      </div>

      <h2>Piezas
        <span class="tip" data-tip="Cada pieza pertenece a un mueble. La columna Veta indica si puede rotar libre o si su veta debe alinearse con la veta de la placa.">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        </span>
      </h2>
      <div id="grupos-container"></div>
      <div class="acciones" id="acciones-piezas"></div>
      <input type="file" id="file-csv" accept=".csv,text/csv" hidden>
    </section>

    <div class="splitter" id="splitter" title="Arrastrá para redimensionar"></div>

    <section class="resultado-panel" id="resultado-panel">
      <div class="acciones acciones-resultado" id="acciones-resultado"></div>
      <div id="resultado"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
