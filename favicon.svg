<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>
  <!-- Plate background -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="url(#g)"/>
  <!-- Wood grain lines -->
  <line x1="8" y1="18" x2="60" y2="18" stroke="#f5e8c8" stroke-width="1" opacity="0.35"/>
  <line x1="8" y1="32" x2="60" y2="32" stroke="#f5e8c8" stroke-width="1" opacity="0.35"/>
  <line x1="8" y1="46" x2="60" y2="46" stroke="#f5e8c8" stroke-width="1" opacity="0.35"/>
  <!-- Guillotine cuts (one horizontal + one vertical, dashed) -->
  <line x1="4" y1="38" x2="60" y2="38" stroke="#fff" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>
  <line x1="36" y1="4" x2="36" y2="38" stroke="#fff" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>
  <!-- Highlight pieces (cut-out regions) -->
  <rect x="8" y="10" width="24" height="24" rx="3" fill="#fde68a" opacity="0.8"/>
  <rect x="40" y="10" width="16" height="24" rx="3" fill="#a7f3d0" opacity="0.8"/>
  <rect x="8" y="42" width="48" height="14" rx="3" fill="#bfdbfe" opacity="0.8"/>
</svg>
